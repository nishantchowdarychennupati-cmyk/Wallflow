name: Build DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: xcodebuild -version && swift --version
      - name: Build DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Wallflow-dmg
          path: build/Wallflow.dmg
